<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Quản Lý Chi Tiêu Gia Đình</title>
  <meta name="description" content="Ứng dụng quản lý chi tiêu gia đình – theo dõi chi phí cố định và hàng ngày." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="app-shell">
    <div class="safe-area-top"></div>

    <!-- Header -->
    <header class="header">
      <h1>Quản Lý Chi Tiêu</h1>
      <p class="header-sub">Tháng 9, 2026</p>
      <p class="header-sub" id="load-status" style="opacity:0.7;font-size:0.85rem;"></p>
    </header>

    <!-- Balance Hero -->
    <section class="balance-card">
      <div class="balance-top">
        <div class="balance-col">
          <span class="balance-label">Thu nhập</span>
          <span class="balance-income" id="income-display">60.000.000₫</span>
        </div>
        <div class="balance-col right">
          <span class="balance-label">Đã chi</span>
          <span class="balance-spent" id="spent-display">0₫</span>
        </div>
      </div>
      <div class="balance-hero">
        <span class="balance-hero-label">Số dư còn lại</span>
        <span class="balance-hero-value" id="remaining-display">60.000.000₫</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width: 0%;"></div>
      </div>
      <div class="progress-meta">
        <span class="progress-text" id="progress-text">Đã chi 0% thu nhập</span>
        <div class="balance-breakdown">
          <span class="breakdown-chip">📌 CĐ: <strong id="sum-fixed">0₫</strong></span>
          <span class="breakdown-chip">🛒 HN: <strong id="sum-daily">0₫</strong></span>
        </div>
      </div>
    </section>

    <!-- Tabs -->
    <nav class="tabs">
      <button class="tab active" id="tab-fixed" onclick="switchTab('fixed')">📌 Cố Định</button>
      <button class="tab" id="tab-daily" onclick="switchTab('daily')">🛒 Hàng Ngày</button>
      <button class="tab" id="tab-income" onclick="switchTab('income')">💰 Thu Nhập</button>
    </nav>

    <!-- ============ FIXED TAB CONTENT ============ -->
    <div class="tab-content active" id="content-fixed">
      <div class="empty-state">
        <span class="empty-icon">⏳</span>
        <p>Đang tải...</p>
      </div>
    </div>

    <!-- ============ DAILY TAB CONTENT ============ -->
    <div class="tab-content" id="content-daily">
      <ul class="item-list" id="daily-list"></ul>
      <div class="empty-state" id="empty-state" style="display:none;">
        <span class="empty-icon">📭</span>
        <p>Chưa có khoản chi nào</p>
      </div>
    </div>

    <!-- ============ INCOME TAB CONTENT ============ -->
    <div class="tab-content" id="content-income">
      <div class="list-group">
        <h3 class="list-group-title">💰 Nguồn Thu Nhập</h3>
        <ul class="item-list" id="income-list"></ul>
      </div>
    </div>

    <!-- FAB -->
    <button class="fab" id="fab" onclick="openModal()" aria-label="Thêm khoản">
      <span class="fab-icon">＋</span>
    </button>

    <div class="safe-area-bottom"></div>
  </div>

  <!-- Modal Overlay -->
  <div class="modal-overlay" id="modal-overlay" onclick="closeModal()"></div>

  <!-- Add Modal (daily / income / fixed) -->
  <div class="modal" id="modal">
    <div class="modal-handle"></div>
    <h3 id="modal-title">Thêm Chi Phí Hàng Ngày</h3>
    <div class="modal-form">
      <label class="form-group">
        <span class="form-label-text">Tên khoản</span>
        <input type="text" id="input-name" placeholder="VD: Cà phê, Ăn trưa..." />
      </label>
      <label class="form-group" id="group-category" style="display:none;">
        <span class="form-label-text">Nhóm</span>
        <select id="input-category">
          <option value="Tiền Mua Nhà">Tiền Mua Nhà</option>
          <option value="Tiền Sinh Hoạt">Tiền Sinh Hoạt</option>
          <option value="Thẻ Tín Dụng">Thẻ Tín Dụng</option>
          <option value="Khác">Khác</option>
        </select>
      </label>
      <label class="form-group" id="group-due" style="display:none;">
        <span class="form-label-text">Ngày trả (hàng tháng)</span>
        <input type="number" id="input-due" placeholder="VD: 5" inputmode="numeric" min="1" max="31" />
      </label>
      <label class="form-group">
        <span class="form-label-text" id="label-amount">Số tiền (₫)</span>
        <input type="number" id="input-amount" placeholder="VD: 50000" inputmode="numeric" />
      </label>
    </div>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeModal()">Hủy</button>
      <button class="btn btn-save" onclick="saveExpense()">Lưu</button>
    </div>
  </div>

  <!-- Edit Daily Modal -->
  <div class="modal-overlay" id="edit-overlay" onclick="closeEditModal()"></div>
  <div class="modal" id="edit-modal">
    <div class="modal-handle"></div>
    <h3>Sửa Khoản Chi</h3>
    <div class="modal-form">
      <label class="form-group">
        <span class="form-label-text">Tên khoản chi</span>
        <input type="text" id="edit-name" />
      </label>
      <label class="form-group">
        <span class="form-label-text">Số tiền (₫)</span>
        <input type="number" id="edit-amount" inputmode="numeric" />
      </label>
    </div>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeEditModal()">Hủy</button>
      <button class="btn btn-save" onclick="saveEdit()">Cập Nhật</button>
    </div>
  </div>

  <!-- Edit Fixed Modal -->
  <div class="modal-overlay" id="edit-fixed-overlay" onclick="closeEditFixedModal()"></div>
  <div class="modal" id="edit-fixed-modal">
    <div class="modal-handle"></div>
    <h3 id="edit-fixed-title">Sửa Khoản Cố Định</h3>
    <div class="modal-form">
      <label class="form-group">
        <span class="form-label-text">Ngày trả (hàng tháng)</span>
        <input type="text" id="edit-fixed-due" inputmode="numeric" placeholder="VD: 5" />
      </label>
      <label class="form-group">
        <span class="form-label-text">Dự tính (₫)</span>
        <input type="number" id="edit-fixed-estimate" inputmode="numeric" />
      </label>
      <label class="form-group">
        <span class="form-label-text">Thực tế (₫)</span>
        <input type="number" id="edit-fixed-actual" inputmode="numeric" />
      </label>
      <label class="form-group checkbox-group">
        <input type="checkbox" id="edit-fixed-paid" />
        <span class="form-label-text" style="margin: 0;">Đã trả</span>
      </label>
    </div>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="deleteFixedItem()" style="color:#c62828;">Xóa</button>
      <button class="btn btn-cancel" onclick="closeEditFixedModal()">Hủy</button>
      <button class="btn btn-save" onclick="saveEditFixed()">Cập Nhật</button>
    </div>
  </div>

  <!-- Edit Income Modal -->
  <div class="modal-overlay" id="edit-income-overlay" onclick="closeEditIncomeModal()"></div>
  <div class="modal" id="edit-income-modal">
    <div class="modal-handle"></div>
    <h3 id="edit-income-title">Sửa Nguồn Thu</h3>
    <div class="modal-form">
      <label class="form-group">
        <span class="form-label-text">Tên nguồn thu</span>
        <input type="text" id="edit-income-name" />
      </label>
      <label class="form-group">
        <span class="form-label-text">Số tiền (₫)</span>
        <input type="number" id="edit-income-amount" inputmode="numeric" />
      </label>
    </div>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeEditIncomeModal()">Hủy</button>
      <button class="btn btn-save" onclick="saveEditIncome()">Cập Nhật</button>
    </div>
  </div>


  <script src="script.js"></script>
</body>

</html>
